<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338CA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bill Splitter">
<title>Team Bill Splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F4F4F7; --surface:#FFFFFF; --ink:#17171F; --muted:#565666; --soft:#3D3D4E;
  --line:#E3E3EA; --hair:#EEEEF3; --field:#C8C8D2; --accent:#4338CA; --accent-tint:#EEF0FF;
  --owe:#B4470B; --error:#A3290F;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground)}
body{font-family:var(--sans);color:var(--ink);font-size:15px;line-height:1.4;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 72px)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:32px;line-height:1.15;font-weight:700}
h2{margin:0;font-size:20px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .note{font-size:14px;color:var(--muted);line-height:1.5}
.mono{font-family:var(--mono)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.kicker{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:26px;font-weight:500}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:#FFF4E5;border:1px solid #F0C48A;border-radius:12px;padding:14px 18px;color:#5C3400}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.why{display:flex;flex-direction:column;gap:3px;background:#F7F7FA;border-radius:8px;padding:8px 10px}
.why div{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--soft)}
.why .mono{white-space:nowrap}
.side{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.in{height:44px;border:1px solid var(--field);border-radius:8px;padding:0 12px;font-size:15px;background:#fff;width:100%;min-width:0}
.in.big{font-family:var(--mono);font-size:18px}
textarea.in{height:auto;padding:10px 12px;font-family:var(--mono);font-size:12px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#EEEEF3;border-radius:10px;padding:4px}
.seg button{height:40px;border-radius:8px;border:0;font-size:15px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid var(--field);background:#fff}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
.btn{height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--field);background:#fff;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.sm{height:36px;padding:0 12px;border-radius:8px;font-size:14px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;height:48px;padding:0 26px;font-size:16px}
.btn.outline{border-color:var(--accent);color:var(--accent);font-weight:600;font-size:14px}
.pay{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.preview{background:var(--accent-tint);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.preview b{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--accent)}
.err{font-size:14px;color:var(--error)}
.item{border-top:1px solid var(--hair);padding:12px 0}
.settle{display:flex;flex-direction:column;gap:10px}
.bal{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--hair)}
.bill{display:flex;align-items:center;gap:14px}
.date{width:48px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);line-height:1.2}
.date b{font-size:18px;color:var(--ink)}
.grow{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.amt{font-family:var(--mono);font-size:17px;font-weight:500;white-space:nowrap}
.icon{width:44px;height:44px;flex-shrink:0;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.icon:hover{background:#EEEEF3}
.person{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.person .name{flex:0 0 110px;font-weight:600}
.person .in{flex:1 1 180px;width:auto;font-family:var(--mono)}
.addrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.addrow label{flex:1 1 160px}
footer{text-align:center;font-size:13px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:#9A9AA8;flex-shrink:0}
.dot.ok{background:#1F8A5B}.dot.busy{background:var(--accent)}.dot.bad{background:var(--owe)}
.pin{max-width:420px;margin:40px auto 0}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<noscript>This app needs JavaScript turned on.</noscript>
<script>
(function () {
  'use strict';

  // ===== Paste your Google Apps Script Web app URL between the quotes. =====
  // Leave it empty to keep everything on this device only.
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-zEdtroWd3Y0sqMPqlDxzJC4hhpwxECZjHBal-YIhMY7-IbGf8o6CcaYUwg2tEnO_/exec';
  // ==========================================================================

  var REMOTE = !!SCRIPT_URL;
  var K = { local: 'split-v1', snap: 'split-v2-snap', queue: 'split-v2-queue', admin: 'split-v2-admin', merged: 'split-v2-merged' };
  var app = document.getElementById('app');

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function daysAgo(n) { return ymd(new Date(Date.now() - n * 86400000)); }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // Reads a stored date safely (handles '2026-10-30' and other formats).
  function day(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
    var d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
    return isNaN(d) ? null : d;
  }
  function shortDate(s) { var d = day(s); return d ? d.getDate() + ' ' + d.toLocaleDateString('en-IN', { month: 'short' }) : ''; }
  function inr(n) { return '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN'); }
  function validUpi(u) { return /^[A-Za-z0-9._-]{2,256}@[A-Za-z][A-Za-z0-9]{1,63}$/.test(u || ''); }
  function isAdmin() { return !REMOTE || !!S.admin; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function sampleData() {
    var all = ['p1', 'p2', 'p3', 'p4', 'p5', 'p6'];
    return {
      people: [
        { id: 'p1', name: 'Aarav', upi: '' }, { id: 'p2', name: 'Priya', upi: '' }, { id: 'p3', name: 'Rohan', upi: '' },
        { id: 'p4', name: 'Neha', upi: '' }, { id: 'p5', name: 'Karan', upi: '' }, { id: 'p6', name: 'Sneha', upi: '' }
      ],
      bills: [
        { id: 'b1', kind: 'meal', title: 'Lunch at Udupi Cafe', date: daysAgo(12), amt: 1860, payer: 'p1', members: all.slice() },
        { id: 'b2', kind: 'birthday', title: 'Chocolate cake', date: daysAgo(8), amt: 1200, payer: 'p3', members: all.slice(), bday: 'p2' },
        { id: 'b3', kind: 'meal', title: 'Biryani dinner', date: daysAgo(5), amt: 2240, payer: 'p4', members: ['p1', 'p3', 'p4', 'p5'] },
        { id: 'b4', kind: 'other', title: 'Team cab to client office', date: daysAgo(2), amt: 640, payer: 'p6', members: ['p2', 'p5', 'p6'] },
        { id: 'b5', kind: 'settle', title: 'Settled up', date: daysAgo(1), amt: 310, payer: 'p5', to: 'p1', members: [] }
      ],
      sample: true
    };
  }

  // ---------- data: last saved copy + changes waiting to upload ----------
  // snap  = the team sheet as last seen (or this device's data when not connected)
  // queue = changes made here that the sheet hasn't confirmed yet
  var snap, queue = [];
  if (REMOTE) {
    snap = lsGet(K.snap, { people: [], bills: [] });
    queue = lsGet(K.queue, []);
  } else {
    var loc = lsGet(K.local, null);
    snap = loc && Array.isArray(loc.people) && Array.isArray(loc.bills) ? loc : sampleData();
  }

  function applyOp(d, o) {
    if (o.op === 'addBill') { if (!d.bills.some(function (b) { return b.id === o.bill.id; })) d.bills.push(o.bill); }
    else if (o.op === 'deleteBill') d.bills = d.bills.filter(function (b) { return b.id !== o.id; });
    else if (o.op === 'upsertPerson') {
      var i = d.people.findIndex(function (p) { return p.id === o.person.id; });
      if (i >= 0) d.people[i] = o.person; else d.people.push(o.person);
    }
    else if (o.op === 'removePerson') d.people = d.people.filter(function (p) { return p.id !== o.id; });
    else if (o.op === 'import') { d.people = clone(o.people); d.bills = clone(o.bills); }
    return d;
  }
  function data() { return queue.reduce(applyOp, clone({ people: snap.people, bills: snap.bills })); }

  var S = {
    admin: REMOTE ? lsGet(K.admin, '') : '', adminDraft: '', adminMsg: '', adminOpen: false,
    status: REMOTE ? 'connecting' : 'local', lastSync: 0, busy: false,
    form: null, error: '', newName: '', newUpi: '', teamMsg: '', backupMsg: '', upiDraft: {}
  };
  S.form = blankForm(data().people);

  function blankForm(people, keep) {
    return {
      kind: keep ? keep.kind : 'meal', title: '', bday: '', amt: '',
      date: keep ? keep.date : today(),
      payer: people.length ? people[0].id : '',
      members: people.map(function (p) { return p.id; })
    };
  }

  function set(patch) { for (var k in patch) S[k] = patch[k]; render(); }
  function setForm(k, v) { var f = Object.assign({}, S.form); f[k] = v; set({ form: f, error: '' }); }

  function doOp(o, extra) {
    if (REMOTE) {
      queue.push(o); lsSet(K.queue, queue);
      set(extra || {});
      flush();
    } else {
      snap = applyOp(clone(snap), o);
      if (o.op !== 'import' || !snap.sample) snap.sample = false;
      lsSet(K.local, snap);
      set(extra || {});
    }
  }

  // ---------- talking to the team sheet ----------
  function post(body) {
    return fetch(SCRIPT_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }
  function got(res) {
    if (!res || !res.ok) {
      throw new Error(res && res.error || 'failed');
    }
    snap = { people: res.people || [], bills: res.bills || [] };
    lsSet(K.snap, snap);
    S.lastSync = Date.now();
    // First load on a new phone: fill the form once the team list arrives.
    if (!S.form.payer && !S.form.members.length) S.form = blankForm(data().people, S.form);
  }
  function flush() {
    if (!REMOTE || S.busy) return;
    if (!queue.length) return refresh();
    S.busy = true; S.status = 'saving'; render();
    post(queue[0]).then(function (res) {
      got(res);
      queue.shift(); lsSet(K.queue, queue);
      S.busy = false; S.status = 'ok';
      if (queue.length) flush(); else render();
    }).catch(function (err) {
      S.busy = false;
      if (err && err.message === 'admin') {
        // Only the admin can change team details: drop that change and sign out of admin.
        queue.shift(); lsSet(K.queue, queue);
        lsDel(K.admin); S.admin = '';
        S.teamMsg = 'Only the admin can change team details. Enter the admin PIN again.';
        S.status = 'ok';
        if (queue.length) flush(); else refresh();
        return;
      }
      S.status = 'offline'; render();
    });
  }
  function refresh() {
    if (!REMOTE || S.busy) return;
    if (queue.length) return flush();
    S.busy = true; if (!S.lastSync) S.status = 'connecting'; render();
    fetch(SCRIPT_URL + '?action=list', { redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        got(res);
        S.busy = false; S.status = 'ok';
        if (S.admin && !lsGet(K.merged, false)) mergeOldData(); else render();
      })
      .catch(function () { S.busy = false; S.status = 'offline'; render(); });
  }

  // First time on a device that already has bills from before the sheet existed:
  // upload anything the sheet doesn't have, matching people by name.
  function mergeOldData() {
    lsSet(K.merged, true);
    var old = lsGet(K.local, null);
    if (!old || old.sample || !Array.isArray(old.people)) { render(); return; }
    var map = {}, ops = [];
    old.people.forEach(function (p) {
      var m = snap.people.find(function (x) { return x.name.trim().toLowerCase() === p.name.trim().toLowerCase(); });
      if (m) {
        map[p.id] = m.id;
        if (!m.upi && p.upi) ops.push({ op: 'upsertPerson', person: Object.assign({}, m, { upi: p.upi }), adminPin: S.admin });
      } else {
        map[p.id] = p.id;
        ops.push({ op: 'upsertPerson', person: { id: p.id, name: p.name, upi: p.upi || '' }, adminPin: S.admin });
      }
    });
    var have = {};
    snap.bills.forEach(function (b) { have[b.id] = true; });
    var r = function (id) { return map[id] || id; };
    (old.bills || []).forEach(function (b) {
      if (have[b.id]) return;
      var nb = Object.assign({}, b, { payer: r(b.payer), members: (b.members || []).map(r) });
      if (b.bday) nb.bday = r(b.bday);
      if (b.to) nb.to = r(b.to);
      ops.push({ op: 'addBill', bill: nb });
    });
    if (ops.length) { queue = queue.concat(ops); lsSet(K.queue, queue); flush(); }
    else render();
  }

  // ---------- money maths ----------
  var D = data(), plan = [];
  function person(id) { return D.people.find(function (p) { return p.id === id; }); }
  function name(id) { var p = person(id); return p ? p.name : 'Removed'; }
  function sharers(b) {
    return (b.members || []).filter(function (m) { return !(b.kind === 'birthday' && b.bday && m === b.bday); });
  }
  function ledger() {
    var bal = {}, paid = {}, share = {};
    D.people.forEach(function (p) { bal[p.id] = 0; paid[p.id] = 0; share[p.id] = 0; });
    function add(o, k, v) { if (o[k] === undefined) o[k] = 0; o[k] += v; }
    D.bills.forEach(function (b) {
      var amt = Number(b.amt) || 0;
      if (b.kind === 'settle') { add(bal, b.payer, amt); add(bal, b.to, -amt); return; }
      var sh = sharers(b); if (!sh.length) return;
      var each = amt / sh.length;
      add(bal, b.payer, amt); add(paid, b.payer, amt);
      sh.forEach(function (m) { add(bal, m, -each); add(share, m, each); });
    });
    return { bal: bal, paid: paid, share: share };
  }
  // Who owes whom, worked out only between two people who actually shared a bill.
  // No chaining through third people: if A never shared a bill with B, A never pays B.
  // Amounts between the same two people are netted, and every line is listed so it's clear why.
  function pairPlan() {
    var pairs = {};
    function owe(debtor, creditor, amt, item) {
      if (!debtor || !creditor || debtor === creditor || !(amt > 0)) return;
      var a = debtor < creditor ? debtor : creditor, b = a === debtor ? creditor : debtor, k = a + '|' + b;
      var p = pairs[k] || (pairs[k] = { a: a, b: b, net: 0, items: [] });
      p.net += debtor === a ? amt : -amt;   // net > 0 means a owes b
      item.debtor = debtor; item.creditor = creditor; item.amt = amt;
      p.items.push(item);
    }
    D.bills.forEach(function (b) {
      var amt = Number(b.amt) || 0;
      if (b.kind === 'settle') { owe(b.to, b.payer, amt, { settle: true, date: b.date }); return; }
      var sh = sharers(b); if (!sh.length) return;
      var title = b.kind === 'birthday' && b.bday ? b.title + ' for ' + name(b.bday) : b.title;
      sh.forEach(function (m) { owe(m, b.payer, amt / sh.length, { title: title, date: b.date }); });
    });
    var out = [];
    Object.keys(pairs).forEach(function (k) {
      var p = pairs[k];
      if (Math.abs(p.net) < 1) return;   // settled (leftover paise ignored)
      var from = p.net > 0 ? p.a : p.b, to = from === p.a ? p.b : p.a;
      out.push({ from: from, to: to, amt: Math.round(Math.abs(p.net)), items: p.items });
    });
    out.sort(function (x, y) { return name(x.from).localeCompare(name(y.from)) || name(x.to).localeCompare(name(y.to)); });
    return out;
  }
  function whyLines(x) {
    return x.items.map(function (it) {
      var plus = it.debtor === x.from, label;
      if (it.settle) label = name(it.creditor) + ' paid ' + name(it.debtor) + (it.date ? ', ' + shortDate(it.date) : '');
      else label = name(it.debtor) + '’s share of ' + it.title + (it.date ? ', ' + shortDate(it.date) : '');
      return '<div><span>' + esc(label) + '</span><span class="mono">' + (plus ? '+' : '−') + inr(it.amt) + '</span></div>';
    }).join('');
  }
  function payUrl(p, amt) {
    return 'upi://pay?pa=' + p.upi + '&pn=' + encodeURIComponent(p.name) + '&am=' + Math.round(amt) + '.00&cu=INR&tn=' + encodeURIComponent('Team bill split');
  }

  // ---------- backup files ----------
  function downloadBackup() {
    if (!isAdmin()) return;
    var d = data();
    var blob = new Blob([JSON.stringify({ app: 'team-bill-splitter', saved: new Date().toISOString(), people: d.people, bills: d.bills }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bill-splitter-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    set({ backupMsg: 'Backup file downloaded. Keep it in Google Drive or email it to yourself.' });
  }
  function restoreFrom(text) {
    if (!isAdmin()) return set({ backupMsg: 'Only the admin can restore a backup.' });
    var d;
    try { d = JSON.parse(text); } catch (e) { return set({ backupMsg: 'That file isn’t a Bill Splitter backup.' }); }
    if (!d || !Array.isArray(d.people) || !Array.isArray(d.bills)) return set({ backupMsg: 'That file isn’t a Bill Splitter backup.' });
    var msg = REMOTE ? 'Replace the whole team sheet with this backup (' + d.people.length + ' people, ' + d.bills.length + ' bills)? Everyone will see the change.'
      : 'Replace everything on this device with this backup?';
    if (!confirm(msg)) return;
    doOp({ op: 'import', people: d.people, bills: d.bills, adminPin: S.admin }, { backupMsg: 'Restored ' + d.people.length + ' people and ' + d.bills.length + ' bills.', form: blankForm(d.people) });
  }

  // ---------- actions ----------
  var actions = {
    kind: function (k) { setForm('kind', k); },
    payer: function (id) { setForm('payer', id); },
    member: function (id) {
      var m = S.form.members.slice(), i = m.indexOf(id);
      if (i >= 0) m.splice(i, 1); else m.push(id);
      setForm('members', m);
    },
    all: function () { setForm('members', D.people.map(function (p) { return p.id; })); },
    none: function () { setForm('members', []); },
    addBill: function () {
      var f = S.form, amt = Number(String(f.amt).replace(/,/g, ''));
      if (!f.title.trim()) return set({ error: f.kind === 'meal' ? 'Add the place you ate at.' : 'Add what the bill was for.' });
      if (!(amt > 0)) return set({ error: 'Enter the total bill amount.' });
      if (!f.payer || !person(f.payer)) return set({ error: 'Pick who paid.' });
      if (f.kind === 'birthday' && !f.bday) return set({ error: 'Pick whose birthday it was.' });
      var b = { id: uid('b'), kind: f.kind, title: f.title.trim(), date: f.date || today(), amt: amt, payer: f.payer, members: f.members.filter(function (m) { return person(m); }) };
      if (f.kind === 'birthday') b.bday = f.bday;
      if (!sharers(b).length) return set({ error: 'Select at least one person to split with.' });
      doOp({ op: 'addBill', bill: b }, { form: blankForm(D.people, f), error: '' });
    },
    mark: function (i) {
      var x = plan[Number(i)]; if (!x) return;
      if (!confirm('Record that ' + name(x.from) + ' paid ' + name(x.to) + ' ' + inr(x.amt) + '?')) return;
      doOp({ op: 'addBill', bill: { id: uid('s'), kind: 'settle', title: 'Settled up', date: today(), amt: x.amt, payer: x.from, to: x.to, members: [] } });
    },
    del: function (id) {
      var b = D.bills.find(function (x) { return x.id === id; });
      if (!b || !confirm('Delete “' + (b.kind === 'settle' ? 'this payment' : b.title) + '”? This removes it for everyone.')) return;
      doOp({ op: 'deleteBill', id: id });
    },
    addPerson: function () {
      if (!isAdmin()) return;
      var n = S.newName.trim(), u = S.newUpi.trim();
      if (!n) return set({ teamMsg: 'Type a name first.' });
      if (D.people.some(function (p) { return p.name.toLowerCase() === n.toLowerCase(); })) return set({ teamMsg: n + ' is already on the team.' });
      if (u && !validUpi(u)) return set({ teamMsg: 'That UPI ID doesn’t look right. It should look like name@okaxis.' });
      var p = { id: uid('p'), name: n, upi: u };
      var f = Object.assign({}, S.form, { members: S.form.members.concat([p.id]) });
      if (!f.payer) f.payer = p.id;
      doOp({ op: 'upsertPerson', person: p, adminPin: S.admin }, { newName: '', newUpi: '', teamMsg: '', form: f });
    },
    remove: function (id) {
      if (!isAdmin()) return;
      var used = D.bills.some(function (b) { return b.payer === id || b.to === id || b.bday === id || (b.members || []).indexOf(id) >= 0; });
      if (used) return set({ teamMsg: name(id) + ' is part of saved bills, so they can’t be removed. Delete those bills first.' });
      if (!confirm('Remove ' + name(id) + ' from the team?')) return;
      var f = Object.assign({}, S.form, { members: S.form.members.filter(function (m) { return m !== id; }) });
      if (f.payer === id) f.payer = '';
      doOp({ op: 'removePerson', id: id, adminPin: S.admin }, { form: f, teamMsg: '' });
    },
    clearSample: function () {
      if (!confirm('Remove the sample names and bills?')) return;
      snap = { people: [], bills: [], sample: false }; lsSet(K.local, snap);
      set({ form: blankForm([]) });
    },
    download: downloadBackup,
    refresh: function () { refresh(); },
    openAdmin: function () { set({ adminOpen: true, adminMsg: '' }); },
    closeAdmin: function () { set({ adminOpen: false, adminDraft: '', adminMsg: '' }); },
    unlockAdmin: function () {
      var p = S.adminDraft.trim();
      if (!p) return set({ adminMsg: 'Enter the admin PIN.' });
      set({ adminMsg: 'Checking…' });
      fetch(SCRIPT_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ op: 'checkAdmin', adminPin: p }) })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res || !res.ok) return set({ adminMsg: 'That PIN isn’t right.' });
          lsSet(K.admin, p);
          S.admin = p; S.adminOpen = false; S.adminDraft = ''; S.adminMsg = ''; S.teamMsg = '';
          if (!lsGet(K.merged, false)) mergeOldData(); else render();
        })
        .catch(function () { set({ adminMsg: 'Can’t reach the team sheet. Check your internet and try again.' }); });
    },
    lockAdmin: function () {
      lsDel(K.admin);
      set({ admin: '', upiDraft: {}, teamMsg: '' });
    }
  };

  var binds = {
    title: function (v) { setForm('title', v); },
    amt: function (v) { setForm('amt', v.replace(/[^0-9.,]/g, '')); },
    date: function (v) { setForm('date', v); },
    bday: function (v) { setForm('bday', v); },
    newName: function (v) { set({ newName: v, teamMsg: '' }); },
    newUpi: function (v) { set({ newUpi: v, teamMsg: '' }); },
    adminPin: function (v) { set({ adminDraft: v, adminMsg: '' }); },
    upi: function (v, id) { var d = Object.assign({}, S.upiDraft); d[id] = v; set({ upiDraft: d }); }
  };
  function commitUpi(id) {
    if (!(id in S.upiDraft) || !isAdmin()) return;
    var v = S.upiDraft[id].trim(), p = person(id);
    var d = Object.assign({}, S.upiDraft); delete d[id];
    if (!p || (p.upi || '') === v) return set({ upiDraft: d });
    doOp({ op: 'upsertPerson', person: Object.assign({}, p, { upi: v }), adminPin: S.admin }, { upiDraft: d });
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    e.preventDefault();
    var fn = actions[el.getAttribute('data-act')];
    if (fn) fn(el.getAttribute('data-arg'));
  });
  app.addEventListener('input', function (e) {
    var el = e.target, b = el.getAttribute && el.getAttribute('data-bind');
    if (b && binds[b]) binds[b](el.value, el.getAttribute('data-arg'));
  });
  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute('data-bind') === 'upi') commitUpi(el.getAttribute('data-arg'));
    if (el.getAttribute('data-file') === 'restore' && el.files && el.files[0]) {
      var r = new FileReader();
      r.onload = function () { restoreFrom(String(r.result)); };
      r.readAsText(el.files[0]);
      el.value = '';
    }
  });
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target.getAttribute) return;
    var b = e.target.getAttribute('data-bind');
    if (b === 'newName' || b === 'newUpi') { e.preventDefault(); actions.addPerson(); }
    if (b === 'adminPin') { e.preventDefault(); actions.unlockAdmin(); }
    if (b === 'upi') { e.preventDefault(); e.target.blur(); }
  });

  // ---------- view ----------
  var ICON_TRASH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>';
  var ICON_X = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>';
  var TAGS = { meal: ['Meal out', '#E7F3EF', '#0B5A40'], birthday: ['Birthday', '#FCE8F1', '#8A1C4A'], other: ['Other', '#EEEEF3', '#3D3D4E'], settle: ['Payment', '#EEF0FF', '#312E81'] };

  function syncView() {
    if (!REMOTE) return '<div class="sync"><span class="dot"></span><span>Saved on this device only</span></div>';
    var dot = 'busy', text = 'Connecting to the team sheet…';
    if (S.status === 'saving') text = 'Saving ' + queue.length + (queue.length === 1 ? ' change…' : ' changes…');
    else if (S.status === 'offline') { dot = 'bad'; text = queue.length ? queue.length + (queue.length === 1 ? ' change' : ' changes') + ' waiting to upload. Check your internet.' : 'Can’t reach the team sheet. Showing the last saved copy.'; }
    else if (S.status === 'ok') { dot = 'ok'; text = 'Saved to the team sheet'; }
    return '<div class="sync" role="status"><span class="dot ' + dot + '"></span><span>' + esc(text) + '</span>' +
      '<button class="btn sm" data-act="refresh"' + (S.busy ? ' disabled' : '') + '>Refresh</button></div>';
  }

  function sortNewest(list) {
    return list.slice().sort(function (a, b) {
      var x = day(a.date), y = day(b.date), dx = x ? x.getTime() : 0, dy = y ? y.getTime() : 0;
      return dy - dx || (a.id < b.id ? 1 : -1);
    });
  }
  function rowView(b, title, l1, l2) {
    var d = day(b.date), tg = TAGS[b.kind] || TAGS.other;
    return '<div class="item bill"><div class="date"><b>' + (d ? d.getDate() : '') + '</b><span>' + (d ? d.toLocaleDateString('en-IN', { month: 'short' }) : '') + '</span></div>' +
      '<div class="grow"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:16px;font-weight:600">' + esc(title) + '</span>' +
      '<span class="tag" style="background:' + tg[1] + ';color:' + tg[2] + '">' + tg[0] + '</span></div>' +
      '<span style="font-size:14px;color:var(--soft)">' + esc(l1) + '</span>' + (l2 ? '<span class="small muted">' + esc(l2) + '</span>' : '') + '</div>' +
      '<span class="amt">' + inr(b.amt) + '</span>' +
      '<button class="icon" aria-label="Delete" data-act="del" data-arg="' + esc(b.id) + '">' + ICON_TRASH + '</button></div>';
  }
  function sectionHead(t, n, one, many) {
    return '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px">' +
      '<h2>' + t + '</h2><span class="muted" style="font-size:14px">' + n + ' ' + (n === 1 ? one : many) + '</span></div>';
  }
  function billsView() {
    var rows = sortNewest(D.bills.filter(function (b) { return b.kind !== 'settle'; }));
    var h = '<section class="card" aria-label="Bills" style="gap:6px">' + sectionHead('Bills', rows.length, 'bill', 'bills');
    if (!rows.length) h += '<p class="muted" style="padding:10px 0">No bills yet. Add the first one above.</p>';
    h += rows.map(function (b) {
      var shs = sharers(b), per = shs.length ? b.amt / shs.length : 0;
      var title = b.kind === 'birthday' && b.bday ? b.title + ' for ' + name(b.bday) : b.title;
      var l2 = 'Split: ' + shs.map(name).join(', ') + (b.kind === 'birthday' && b.bday ? ' (birthday: ' + name(b.bday) + ', free)' : '');
      return rowView(b, title, 'Paid by ' + name(b.payer) + ', ' + inr(per) + ' each', l2);
    }).join('');
    return h + '</section>';
  }
  function paymentsView() {
    var rows = sortNewest(D.bills.filter(function (b) { return b.kind === 'settle'; }));
    var h = '<section class="card" aria-label="Payments" style="gap:6px">' + sectionHead('Payments', rows.length, 'payment', 'payments');
    if (!rows.length) h += '<p class="muted" style="padding:10px 0">No payments yet. When someone pays, tap Mark paid under Who owes whom.</p>';
    h += rows.map(function (b) { return rowView(b, name(b.payer) + ' paid ' + name(b.to), 'Marked as paid', ''); }).join('');
    return h + '</section>';
  }

  function view() {
    D = data();
    var f = S.form, L = ledger();
    plan = pairPlan();
    var total = D.bills.reduce(function (a, b) { return a + (b.kind === 'settle' ? 0 : Number(b.amt) || 0); }, 0);
    var open = plan.reduce(function (a, x) { return a + x.amt; }, 0);
    var h = '';

    h += '<header class="head"><div style="display:flex;flex-direction:column;gap:6px">' +
      '<p class="kicker">Team expenses</p><h1>Bill Splitter</h1>' + syncView() + '</div>' +
      '<div class="stats"><div class="stat"><span class="small muted">Spent together</span><b>' + inr(total) + '</b></div>' +
      '<div class="stat"><span class="small muted">Still to settle</span><b style="color:var(--owe)">' + inr(open) + '</b></div></div></header>';

    if (!REMOTE && snap.sample) {
      h += '<div class="banner"><span>These are sample names and bills. Clear them, then add your team’s names under Team.</span>' +
        '<button class="btn dark" data-act="clearSample">Clear sample data</button></div>';
    }

    // Add bill
    var kinds = [['meal', 'Meal out'], ['birthday', 'Birthday'], ['other', 'Other']];
    var titleLabel = f.kind === 'meal' ? 'Where did you eat?' : f.kind === 'birthday' ? 'What was bought?' : 'What was it for?';
    var titleHint = f.kind === 'meal' ? 'Restaurant or place' : f.kind === 'birthday' ? 'Cake, decorations, gift…' : 'Cab, snacks, team outing…';
    var whoLabel = f.kind === 'birthday' ? 'Who was at the celebration?' : f.kind === 'meal' ? 'Who came to eat?' : 'Who is sharing this?';
    var members = f.members.filter(function (m) { return person(m); });
    var sh = sharers({ kind: f.kind, members: members, bday: f.bday });
    var amt = Number(String(f.amt).replace(/,/g, '')) || 0;
    var each = sh.length ? amt / sh.length : 0;
    var line = sh.length ? 'each, split between ' + sh.length + (sh.length === 1 ? ' person' : ' people') : 'Select who to split with';
    if (f.kind === 'birthday' && f.bday) line += '. ' + name(f.bday) + ' doesn’t pay.';

    h += '<div class="row"><div class="main"><section class="card" aria-label="Add a bill"><h2>Add a bill</h2>';
    h += '<div class="seg">' + kinds.map(function (k) {
      var on = f.kind === k[0];
      return '<button class="' + (on ? 'on' : '') + '" aria-pressed="' + on + '" data-act="kind" data-arg="' + k[0] + '">' + k[1] + '</button>';
    }).join('') + '</div>';
    h += '<div class="grid">';
    h += '<label class="f">' + titleLabel + '<input class="in" type="text" data-k="title" data-bind="title" placeholder="' + esc(titleHint) + '" value="' + esc(f.title) + '"></label>';
    if (f.kind === 'birthday') {
      h += '<label class="f">Whose birthday?<select class="in" data-k="bday" data-bind="bday"><option value="">Pick a person</option>' +
        D.people.map(function (p) { return '<option value="' + esc(p.id) + '"' + (f.bday === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') +
        '</select></label>';
    }
    h += '<label class="f">Total bill (₹)<input class="in big" type="text" inputmode="decimal" data-k="amt" data-bind="amt" placeholder="0" value="' + esc(f.amt) + '"></label>';
    h += '<label class="f">Date<input class="in" type="date" data-k="date" data-bind="date" value="' + esc(f.date) + '"></label>';
    h += '</div>';

    h += '<div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:14px;font-weight:600">Who paid?</span><div class="chips">';
    if (!D.people.length) h += '<span class="note">Add people under Team first.</span>';
    h += D.people.map(function (p) {
      var on = f.payer === p.id;
      return '<button class="chip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-act="payer" data-arg="' + esc(p.id) + '">' + esc(p.name) + '</button>';
    }).join('') + '</div></div>';

    h += '<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px">' +
      '<span style="font-size:14px;font-weight:600">' + whoLabel + '</span><div style="display:flex;gap:6px">' +
      '<button class="btn sm" data-act="all">Everyone</button><button class="btn sm" data-act="none">Clear</button></div></div><div class="chips">';
    h += D.people.map(function (p) {
      var on = members.indexOf(p.id) >= 0;
      return '<button class="chip' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-act="member" data-arg="' + esc(p.id) + '">' + esc(p.name) + '</button>';
    }).join('') + '</div></div>';

    h += '<div class="preview"><div style="display:flex;flex-direction:column;gap:2px"><b>' + inr(each) + '</b>' +
      '<span style="font-size:14px;color:var(--soft)">' + esc(line) + '</span></div>' +
      '<button class="btn primary" data-act="addBill">Add bill</button></div>';
    if (S.error) h += '<p class="err" role="alert">' + esc(S.error) + '</p>';
    h += '</section>';
    h += billsView() + paymentsView();
    h += '</div>';

    // Who owes whom + balances
    h += '<aside class="side"><section class="card" aria-label="Who owes whom" style="gap:8px"><h2>Who owes whom</h2>' +
      '<p class="note">Only between people who shared a bill. Each line shows the bills behind it. On a phone, the pay button opens Google Pay with the amount filled in; after paying, tap Mark paid.</p>';
    if (!plan.length) h += '<p class="muted" style="padding-top:6px">Everyone is settled up.</p>';
    h += plan.map(function (x, i) {
      var rp = person(x.to) || {}, ok = !!rp.upi && validUpi(rp.upi);
      var s = '<div class="item settle"><div style="display:flex;flex-direction:column;gap:2px">' +
        '<span><strong>' + esc(name(x.from)) + '</strong> pays <strong>' + esc(name(x.to)) + '</strong></span>' +
        '<span class="mono" style="font-size:18px;color:var(--owe)">' + inr(x.amt) + '</span></div>' +
        '<div class="why">' + whyLines(x) + '</div><div style="display:flex;flex-wrap:wrap;gap:8px">';
      if (ok) s += '<a class="pay" href="' + esc(payUrl(rp, x.amt)) + '" aria-label="Pay ' + esc(name(x.to)) + ' ' + inr(x.amt) + ' on Google Pay">Pay ' + inr(x.amt) + ' on GPay</a>';
      s += '<button class="btn outline" data-act="mark" data-arg="' + i + '">Mark paid</button></div>';
      if (!ok) s += '<span class="small muted">' + esc(name(x.to)) + ' isn’t set up for GPay yet. Pay them directly, then tap Mark paid.</span>';
      return s + '</div>';
    }).join('');
    h += '</section>';

    h += '<section class="card" aria-label="Balances" style="gap:4px"><h2 style="margin-bottom:8px">Everyone’s balance</h2>';
    if (!D.people.length) h += '<p class="muted">No one on the team yet.</p>';
    h += D.people.map(function (p) {
      var v = Math.round(L.bal[p.id] || 0);
      var status = v > 0 ? 'Gets back ' + inr(v) : v < 0 ? 'Owes ' + inr(v) : 'Settled up';
      var color = v > 0 ? 'var(--accent)' : v < 0 ? 'var(--owe)' : 'var(--muted)';
      return '<div class="bal"><div style="display:flex;flex-direction:column;gap:1px"><span style="font-weight:500">' + esc(p.name) + '</span>' +
        '<span class="small muted">Paid ' + inr(L.paid[p.id] || 0) + ', share ' + inr(L.share[p.id] || 0) + '</span></div>' +
        '<span style="font-size:14px;font-weight:600;text-align:right;color:' + color + '">' + status + '</span></div>';
    }).join('');
    h += '</section></aside></div>';

    // Team + backup
    var admin = isAdmin();
    h += '<div class="grid2"><section class="card" aria-label="Team"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px"><h2>Team</h2>';
    if (REMOTE && admin) h += '<button class="btn sm" data-act="lockAdmin">Done editing</button>';
    if (REMOTE && !admin && !S.adminOpen) h += '<button class="btn sm" data-act="openAdmin">Edit team</button>';
    h += '</div>';

    if (REMOTE && !admin && S.adminOpen) {
      h += '<div style="display:flex;flex-direction:column;gap:10px;background:var(--accent-tint);border-radius:12px;padding:14px">' +
        '<p class="note" style="color:var(--soft)">Only the admin can change names and UPI IDs.</p>' +
        '<div class="addrow"><label class="f">Admin PIN<input class="in big" type="password" inputmode="numeric" autocomplete="off" data-k="adminPin" data-bind="adminPin" value="' + esc(S.adminDraft) + '"></label>' +
        '<button class="btn dark" data-act="unlockAdmin">Unlock</button><button class="btn" data-act="closeAdmin">Cancel</button></div>' +
        (S.adminMsg ? '<p class="err" role="status">' + esc(S.adminMsg) + '</p>' : '') + '</div>';
    }

    if (!admin) {
      h += '<div>' + D.people.map(function (p) {
        var ready = !!p.upi && validUpi(p.upi);
        return '<div class="bal"><span style="font-weight:500">' + esc(p.name) + '</span>' +
          '<span class="small" style="color:' + (ready ? '#1F6E4A' : 'var(--muted)') + '">' + (ready ? 'GPay ready' : 'No GPay yet') + '</span></div>';
      }).join('') + '</div>';
    } else {
      h += '<p class="note">Add each person’s UPI ID, the one they use on Google Pay (it looks like name@okaxis). Only you can see these; everyone else just sees a Pay on GPay button.</p><div>';
      h += D.people.map(function (p) {
        var v = p.id in S.upiDraft ? S.upiDraft[p.id] : (p.upi || '');
        var bad = !!v && !validUpi(v.trim());
        return '<div class="item" style="padding:6px 0;display:flex;flex-direction:column;gap:4px"><div class="person"><span class="name">' + esc(p.name) + '</span>' +
          '<input class="in" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="' + esc(p.name) + '’s UPI ID" placeholder="UPI ID, e.g. name@okaxis" data-k="upi-' + esc(p.id) + '" data-bind="upi" data-arg="' + esc(p.id) + '" value="' + esc(v) + '">' +
          '<button class="icon" aria-label="Remove ' + esc(p.name) + '" data-act="remove" data-arg="' + esc(p.id) + '">' + ICON_X + '</button></div>' +
          (bad ? '<span class="small" style="color:var(--error)">This doesn’t look like a UPI ID yet. It should look like name@okaxis.</span>' : '') + '</div>';
      }).join('');
      h += '</div><div class="addrow">' +
        '<label class="f">Add a person<input class="in" type="text" placeholder="Name" data-k="newName" data-bind="newName" value="' + esc(S.newName) + '"></label>' +
        '<label class="f">UPI ID (optional)<input class="in mono" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="name@okaxis" data-k="newUpi" data-bind="newUpi" value="' + esc(S.newUpi) + '"></label>' +
        '<button class="btn dark" data-act="addPerson">Add</button></div>';
    }
    if (S.teamMsg) h += '<p class="err" role="status">' + esc(S.teamMsg) + '</p>';
    h += '</section>';

    if (admin) {
      h += '<section class="card" aria-label="Backup"><h2>Backup file</h2>' +
        '<p class="note">' + (REMOTE
          ? 'Everything is saved in your team’s Google Sheet. For an extra copy, download a backup file now and then. It includes UPI IDs, so keep it private.'
          : 'Bills are saved in this browser only. Download a backup file regularly so you never lose them, and open it here to restore.') + '</p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" style="flex:1 1 auto" data-act="download">Download backup file</button>' +
        '<label class="btn filebtn" style="flex:1 1 auto">Restore from file<input type="file" accept=".json,application/json" data-file="restore" aria-label="Restore from a backup file"></label></div>';
      if (S.backupMsg) h += '<p role="status" style="font-size:14px">' + esc(S.backupMsg) + '</p>';
      h += '</section>';
    }
    h += '</div>';

    h += '<footer>' + (REMOTE ? 'Bills are saved to your team’s Google Sheet.' : 'Your data stays on this device. Nothing is sent anywhere.') + '</footer>';
    return h;
  }

  function render() {
    var a = document.activeElement, key = a && a.getAttribute ? a.getAttribute('data-k') : null, ss = null, se = null;
    try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) {}
    var y = window.scrollY;
    app.innerHTML = view();
    if (key) {
      var el = app.querySelector('[data-k="' + key + '"]');
      if (el) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) {} }
    }
    window.scrollTo(0, y);
  }

  render();
  if (REMOTE) {
    refresh();
    setInterval(function () {
      var typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('input,select,textarea');
      if (document.visibilityState === 'visible' && !typing) refresh();
    }, 30000);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(); });
    window.addEventListener('online', function () { flush(); });
  }
})();
</script>
</body>
</html>
